# ─────────────────────────────────────────────────────────────────────
# nginx site config for قانون‌یاب (modavanat.ir)
#
# Install on the VPS:
#   sudo cp deploy/nginx/modavanat.ir.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/modavanat.ir.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Requires:
#   - SSL certs at /etc/letsencrypt/live/modavanat.ir/ (run certbot first)
#   - Next.js standalone server running on 127.0.0.1:3000 (via `bun start`)
#   - Optional: socket.io on 127.0.0.1:3001 for live amendment notifications
#
# SSL over DNS: ensure A/AAAA records for modavanat.ir and www.modavanat.ir
# both point at this VPS before running certbot — Let's Encrypt validates
# via DNS-01 (or HTTP-01, which also requires DNS to resolve first).
# ─────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect (also needed for Let's Encrypt HTTP-01 challenges).
server {
    listen 80;
    listen [::]:80;
    server_name modavanat.ir www.modavanat.ir;

    # Keep this open during certbot's HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modavanat.ir www.modavanat.ir;

    # ─── SSL certificate chain ───────────────────────────────────────
    # Fullchain = server cert + intermediate(s) bundled by certbot
    ssl_certificate     /etc/letsencrypt/live/modavanat.ir/fullchain.pem;
    # Private key (NEVER commit, NEVER serve over HTTP)
    ssl_certificate_key /etc/letsencrypt/live/modavanat.ir/privkey.pem;

    # TLS 1.2 + 1.3 only; disable old protocols.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;  # let client pick; modern recommendation
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;  # forward secrecy

    # ─── OCSP stapling ──────────────────────────────────────────────
    ssl_stapling on;
    ssl_stapling_verify on;
    # Trust the full chain — let resolver look up OCSP responder.
    ssl_trusted_certificate /etc/letsencrypt/live/modavanat.ir/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ─── Security headers ───────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ─── Body limits (file uploads for law import JSONs up to 50MB) ─
    client_max_body_size 50m;

    # ─── Gzip for HTML/CSS/JS ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Locations of static assets
    root /var/www/modavanat/public;
    index index.html;

    # ─── Next.js standalone app on 127.0.0.1:3000 ──────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Next.js streaming / SSE support
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─── Socket.io endpoint (Phase 5) — separate port, with WS upgrade ─
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # 24h — keep WS open
    }

    # ─── Static asset caching (Next.js _next/static has hashed names,
    # so immutable caching is safe) ────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ─── Long-cache fonts / images / robots ────────────────────────
    location ~* \.(?:woff2?|png|jpg|jpeg|gif|svg|webp|ico|txt|xml)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }
}
